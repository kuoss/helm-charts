{{- if .Values.venti.enabled -}}
{{- if .Values.venti.route.enabled -}}
{{- $serviceName := include "venti.fullname" . }}
{{- $servicePort := .Values.venti.service.servicePort -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
{{- if .Values.venti.route.annotations }}
  annotations:
{{ toYaml .Values.venti.route.annotations | indent 4 }}
{{- end }}
  labels:
    {{- include "venti.labels" . | nindent 4 }}
{{- range $key, $value := .Values.venti.route.extraLabels }}
    {{ $key }}: {{ $value | quote }}
{{- end }}
  name: {{ template "venti.fullname" . }}
  namespace: {{ template "venti-stack.namespace" . }}
spec:
{{- with .Values.venti.route.parentRefs }}
  parentRefs:
{{ toYaml . | indent 4 }}
{{- end }}
{{- with .Values.venti.route.hosts }}
  hostnames:
{{ tpl (toYaml .) $ | indent 4 }}
{{- end }}
  rules:
    - matches:
        - path:
            type: {{ .Values.venti.route.pathType }}
            value: {{ .Values.venti.route.path }}
      backendRefs:
        - name: {{ $serviceName }}
          port: {{ $servicePort }}
{{- end -}}
{{- end -}}
